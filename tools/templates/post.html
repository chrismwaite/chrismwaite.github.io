<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{TITLE}} – chriswaite.dev</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="index,follow" />
        <meta name="description" content="{{DESCRIPTION}}" />
        <meta name="author" content="Christopher Waite" />
        <link rel="canonical" href="{{URL}}" />
        <meta property="og:title" content="{{TITLE}}" />
        <meta property="og:description" content="{{DESCRIPTION}}" />
        <meta property="og:url" content="{{URL}}" />
        <meta property="og:type" content="article" />
        <meta property="og:site_name" content="chriswaite.dev" />
        <meta property="article:published_time" content="{{DATE_ISO}}" />
{{IMAGE_META}}        <meta name="twitter:title" content="{{TITLE}}" />
        <meta name="twitter:description" content="{{DESCRIPTION}}" />
        <link rel="icon" href="{{ROOT}}/favicon.svg" type="image/svg+xml" />
        <link rel="alternate" type="application/rss+xml" title="chriswaite.dev" href="/feed.xml" />
        <link rel="stylesheet" href="{{ROOT}}/styles/global.css" />
{{PRISM_CSS}}        <script type="application/ld+json">
{{JSON_LD}}
        </script>
    </head>
    <body>
        <a class="skip-link" href="#content">Skip to content</a>
{{HEADER}}
        <main id="content" class="page page-narrow">
            <article class="post">
                <header class="post-header">
                    <h1 class="title">{{TITLE}}</h1>
{{SERIES_TAG}}                    <time class="date" datetime="{{DATE_ISO}}">{{DATE_DISPLAY}}</time>
                </header>
                <div class="post-body">
<!-- post:content -->
{{CONTENT}}
<!-- /post:content -->
                </div>
            </article>
{{SERIES_BOX}}{{POST_NAV}}        </main>
{{PRISM_JS}}    </body>
</html>
